name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg  # headless CI runner has no display; force matplotlib's non-interactive backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -v

  results-ledger:
    # Run the ledger on both platforms. The benchmark artifacts are pinned by
    # sha256, and a raw float64 dump is not byte-reproducible across BLAS
    # backends -- so this matrix is what actually proves the canonicalisation
    # in q_ai_governance/canonical_json.py works, rather than trusting that
    # rounding is enough. If a value ever lands on a rounding boundary, this
    # job is where it surfaces.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Every number this repository publishes must trace to a command that
      # regenerates it, or to an artifact whose non-reproducibility is stated
      # explicitly (see tools/ledger/README.md). This is the direct response to
      # CORRECTIONS.md: it turns "a number nobody re-ran" from a silent failure
      # into a failing build.
      - name: Verify results ledger
        run: python3 tools/ledger/check_ledger.py
