name: Float noise probe (temporary)

on:
  push:
    branches: [fix/canonical-float-output]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Regenerate both benchmarks
        run: |
          mkdir -p probe_out
          python3 q_ai_governance/benchmark_snapshot_real.py --data data/snapshot_dao_dataset.json --out probe_out/classical.json
          python3 q_ai_governance/benchmark_contestedness.py --data data/snapshot_dao_dataset.json --out probe_out/contestedness.json
          python3 -c "import numpy,platform;print(platform.platform());print('numpy',numpy.__version__);numpy.show_config()" > probe_out/env.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.os }}
          path: probe_out/
