[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "q-ai-governance"
version = "1.0.0"
description = "Quantum-Cognitive AI (Q-AI) Policy Agent & Real DAO Governance Decision Engine"
readme = "README.md"
authors = [{ name = "Jonathan Reiser" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "numpy>=1.22",
    "matplotlib>=3.5",
    "scipy>=1.8",
    "requests>=2.28"
]

[project.optional-dependencies]
apps = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "pandas>=2.0"
]
chat = [
    "torch>=2.2",
    "transformers>=4.38"
]
dev = [
    "pytest>=7.0"
]

[project.scripts]
q-ai-gov = "q_ai_governance.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]
